<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroShift · CaGiMe・MeKaBu モジュール設定</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./" aria-label="ZeroShift ホーム"><i aria-hidden="true"></i>ZeroShift</a>
      <span class="models">CaGiMe / MeKaBu</span>
    </header>
    <div class="workspace">
      <section class="connect" aria-labelledby="heading">
        <div class="title-row"><h1 id="heading">モジュール設定</h1><strong id="side">未接続</strong></div>
        <p id="status" role="status">左側のキーボードを PC に接続してください。</p>
        <div class="bar">
          <button type="button" id="connection">USB 接続</button>
          <button type="button" id="wireless">無線接続</button>
          <button type="button" id="demo">デモモード</button>
        </div>
        <details id="help">
          <summary>接続方法</summary>
          <p>USB は左側の Studio 用ポートを選びます。無線では左側を PC とペアリングし、接続候補から機種名を選んでください。</p>
          <p>CaGiMe が無線の候補に出ないときは、標準配列の左側で Esc を押しながら U を押します。</p>
        </details>
      </section>
      <section id="target-bar" hidden aria-label="設定対象">
        <fieldset id="target" class="halves">
          <legend>設定する側</legend>
          <label><input type="radio" name="half" value="left" checked><span><i aria-hidden="true"></i>左側</span></label>
          <label><input type="radio" name="half" value="right"><span><i aria-hidden="true"></i>右側</span></label>
        </fieldset>
        <button id="reload">再読込</button>
        <button type="button" id="restart" hidden>デモで再起動</button>
      </section>
    <form hidden id="modules">
      <div class="slots">
        <fieldset class="slot" id="lower" aria-describedby="lower-state">
          <legend><b id="slot-name">下側</b> <span id="lower-connector"></span></legend>
          <div class="choices">
              <label><input type="radio" name="lowerMode" value="off"><span><img class="module-icon" src="icons/off.png" width="32" height="32" alt="">オフ</span></label>
              <label><input type="radio" name="lowerMode" value="pmw3610"><span><img class="module-icon" src="icons/pmw3610.png" width="32" height="32" alt="">トラックボール<small>PMW3610</small></span></label>
              <label><input type="radio" name="lowerMode" value="encoder"><span><img class="module-icon" src="icons/encoder.png" width="32" height="32" alt="">エンコーダ</span></label>
              <label data-extended><input type="radio" name="lowerMode" value="pat9125"><span><img class="module-icon" src="icons/pat9125.png" width="32" height="32" alt="">光学エンコーダ<small>PAT9125</small></span></label>
              <label data-extended><input type="radio" name="lowerMode" value="lpps"><span><img class="module-icon" src="icons/lpps.png" width="32" height="32" alt="">LPPS<small>ADS1220</small></span></label>
              <label><input type="radio" name="lowerMode" value="stick"><span><img class="module-icon" src="icons/stick.png" width="32" height="32" alt="">アナログスティック</span></label>
              <label><input type="radio" name="lowerMode" value="key"><span><img class="module-icon" src="icons/key.png" width="32" height="32" alt="">1uキー</span></label>
              <label data-mekabu><input type="radio" name="lowerMode" value="rzt"><span><img class="module-icon" src="icons/rzt.png" width="32" height="32" alt="">RZT</span></label>
              <label data-mekabu><input type="radio" name="lowerMode" value="tpd"><span><img class="module-icon" src="icons/tpd.png" width="32" height="32" alt="">トラックパッド</span></label>
          </div>
          <small id="lower-state"></small>
        </fieldset>
        <fieldset class="slot" id="inner" aria-describedby="inner-state">
          <legend>中央側 <span id="inner-connector"></span></legend>
          <div class="choices">
              <label><input type="radio" name="innerMode" value="off"><span><img class="module-icon" src="icons/off.png" width="32" height="32" alt="">オフ</span></label>
              <label><input type="radio" name="innerMode" value="pmw3610"><span><img class="module-icon" src="icons/pmw3610.png" width="32" height="32" alt="">トラックボール<small>PMW3610</small></span></label>
              <label><input type="radio" name="innerMode" value="lpps"><span><img class="module-icon" src="icons/lpps.png" width="32" height="32" alt="">LPPS<small>ADS1220</small></span></label>
              <label><input type="radio" name="innerMode" value="encoder"><span><img class="module-icon" src="icons/encoder.png" width="32" height="32" alt="">エンコーダ</span></label>
              <label data-extended><input type="radio" name="innerMode" value="pat9125"><span><img class="module-icon" src="icons/pat9125.png" width="32" height="32" alt="">光学エンコーダ<small>PAT9125</small></span></label>
              <label><input type="radio" name="innerMode" value="key"><span><img class="module-icon" src="icons/key.png" width="32" height="32" alt="">1uキー</span></label>
          </div>
          <small id="inner-state"></small>
        </fieldset>
      </div>
      <div class="actions">
        <span id="edit-state" role="status"></span>
        <button type="submit" id="save">設定を保存</button>
      </div>
    </form>
    </div>
  </main>
</body>
</html>
