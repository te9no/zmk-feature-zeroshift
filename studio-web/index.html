<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroShift · CaGiMe・MeKaBu モジュール設定</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="module-off" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><path d="m9 23 14-14"/></symbol>
    <symbol id="module-pmw3610" viewBox="0 0 32 32"><circle cx="16" cy="13" r="8.5"/><path d="M11.5 12a5 5 0 0 1 4-4M7 18l-3 5c1 5 23 5 24 0l-3-5M6 22c4 4 16 4 20 0"/></symbol>
    <symbol id="module-encoder" viewBox="0 0 32 32"><ellipse cx="16" cy="11" rx="11" ry="6"/><path d="M5 11v10c0 8 22 8 22 0V11M16 11l5-3M9 17v5m5-4v6m5-6v6m5-8v6"/></symbol>
    <symbol id="module-pat9125" viewBox="0 0 32 32"><circle cx="15" cy="12" r="8"/><circle cx="15" cy="12" r="2.5"/><path d="m15 6 1 2m5 3-2 1m-8 4 2-1M5 26h10v-5H5zM15 24l7-5m-2 8 5-5"/></symbol>
    <symbol id="module-lpps" viewBox="0 0 32 32"><ellipse cx="16" cy="15" rx="5" ry="3"/><path d="M11 15v4c0 4 10 4 10 0v-4M7 24c4 3 14 3 18 0M4 14h4m-2-2 2 2-2 2m22-2h-4m2-2-2 2 2 2M16 3v6m-3-3 3 3 3-3"/></symbol>
    <symbol id="module-stick" viewBox="0 0 32 32"><ellipse cx="12" cy="24" rx="9" ry="3"/><path d="m10 22 6-11m-2 12 6-11"/><circle cx="20" cy="8" r="5"/></symbol>
    <symbol id="module-key" viewBox="0 0 32 32"><path d="m5 21 3-13 15-2 4 13v5l-19 3-3-2zm3-13 3 12 12-2V6M5 21l6-1m12-2 4 1"/></symbol>
    <symbol id="module-rzt" viewBox="0 0 32 32"><path d="M7 5h5v9a4 4 0 0 0 8 0V5h5v9a9 9 0 0 1-18 0zM7 10h5m8 0h5M12 28h8m-6-3v3m4-3v3"/></symbol>
    <symbol id="module-tpd" viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="4"/><path d="M7 22h18M10 18l8-8m-3 8 6-6"/></symbol>
  </svg>
  <main>
    <header>
      <a class="brand" href="./" aria-label="ZeroShift ホーム"><i aria-hidden="true"></i>ZeroShift</a>
      <span class="models">CaGiMe / MeKaBu</span>
    </header>
    <div class="workspace">
      <section class="connect" aria-labelledby="heading">
        <div class="title-row"><h1 id="heading">モジュール設定</h1><strong id="side">未接続</strong></div>
        <p id="status" role="status">左側のキーボードを PC に接続してください。</p>
        <div class="bar">
          <button type="button" id="connection">USB 接続</button>
          <button type="button" id="wireless">無線接続</button>
          <button type="button" id="demo">デモモード</button>
        </div>
        <details id="help">
          <summary>接続方法</summary>
          <p>USB は左側の Studio 用ポートを選びます。無線では左側を PC とペアリングし、接続候補から機種名を選んでください。</p>
          <p>CaGiMe が無線の候補に出ないときは、標準配列の左側で Esc を押しながら U を押します。</p>
        </details>
      </section>
      <section id="target-bar" hidden aria-label="設定対象">
        <fieldset id="target" class="halves">
          <legend>設定する側</legend>
          <label><input type="radio" name="half" value="left" checked><span><i aria-hidden="true"></i>左側</span></label>
          <label><input type="radio" name="half" value="right"><span><i aria-hidden="true"></i>右側</span></label>
        </fieldset>
        <button id="reload">再読込</button>
        <button type="button" id="restart" hidden>デモで再起動</button>
      </section>
    <form hidden id="modules">
      <div class="slots">
        <fieldset class="slot" id="lower" aria-describedby="lower-state">
          <legend><b id="slot-name">下側</b> <span id="lower-connector"></span></legend>
          <div class="choices">
              <label><input type="radio" name="lowerMode" value="off"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-off"/></svg>オフ</span></label>
              <label><input type="radio" name="lowerMode" value="pmw3610"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-pmw3610"/></svg>トラックボール<small>PMW3610</small></span></label>
              <label><input type="radio" name="lowerMode" value="encoder"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-encoder"/></svg>エンコーダ</span></label>
              <label data-extended><input type="radio" name="lowerMode" value="pat9125"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-pat9125"/></svg>光学エンコーダ<small>PAT9125</small></span></label>
              <label data-extended><input type="radio" name="lowerMode" value="lpps"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-lpps"/></svg>LPPS<small>ADS1220</small></span></label>
              <label><input type="radio" name="lowerMode" value="stick"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-stick"/></svg>アナログスティック</span></label>
              <label><input type="radio" name="lowerMode" value="key"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-key"/></svg>1uキー</span></label>
              <label data-mekabu><input type="radio" name="lowerMode" value="rzt"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-rzt"/></svg>RZT</span></label>
              <label data-mekabu><input type="radio" name="lowerMode" value="tpd"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-tpd"/></svg>トラックパッド</span></label>
          </div>
          <small id="lower-state"></small>
        </fieldset>
        <fieldset class="slot" id="inner" aria-describedby="inner-state">
          <legend>中央側 <span id="inner-connector"></span></legend>
          <div class="choices">
              <label><input type="radio" name="innerMode" value="off"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-off"/></svg>オフ</span></label>
              <label><input type="radio" name="innerMode" value="pmw3610"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-pmw3610"/></svg>トラックボール<small>PMW3610</small></span></label>
              <label><input type="radio" name="innerMode" value="lpps"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-lpps"/></svg>LPPS<small>ADS1220</small></span></label>
              <label><input type="radio" name="innerMode" value="encoder"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-encoder"/></svg>エンコーダ</span></label>
              <label data-extended><input type="radio" name="innerMode" value="pat9125"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-pat9125"/></svg>光学エンコーダ<small>PAT9125</small></span></label>
              <label><input type="radio" name="innerMode" value="key"><span><svg class="module-icon" aria-hidden="true" focusable="false"><use href="#module-key"/></svg>1uキー</span></label>
          </div>
          <small id="inner-state"></small>
        </fieldset>
      </div>
      <div class="actions">
        <span id="edit-state" role="status"></span>
        <button type="submit" id="save">設定を保存</button>
      </div>
    </form>
    </div>
  </main>
</body>
</html>
