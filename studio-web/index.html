<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroShift · CaGiMe・MeKaBu モジュール設定</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./" aria-label="ZeroShift ホーム"><i aria-hidden="true"></i>ZeroShift</a>
      <span class="models">CaGiMe / MeKaBu</span>
    </header>
    <div class="workspace">
      <section class="connect" aria-labelledby="heading">
        <div class="title-row"><h1 id="heading">モジュール設定</h1><strong id="side">未接続</strong></div>
        <p id="status" role="status">左側のキーボードを PC に接続してください。</p>
        <div class="bar">
          <button type="button" id="connection">USB 接続</button>
          <button type="button" id="wireless">無線接続</button>
          <button type="button" id="demo">デモモード</button>
        </div>
        <details id="help">
          <summary>接続方法</summary>
          <p>USB は左側の Studio 用ポートを選びます。無線では左側を PC とペアリングし、接続候補から機種名を選んでください。</p>
          <p>CaGiMe が無線の候補に出ないときは、標準配列の左側で Esc を押しながら U を押します。</p>
        </details>
      </section>
      <section id="target-bar" hidden aria-label="設定対象">
        <label for="target">設定する側</label>
        <select id="target"><option value="left">左側</option><option value="right">右側</option></select>
        <button id="reload">再読込</button>
        <button type="button" id="restart" hidden>デモで再起動</button>
      </section>
    <form hidden id="modules">
      <div class="slots">
        <div class="slot">
          <label for="lower"><b id="slot-name">下側</b> <span id="lower-connector"></span></label>
          <select id="lower" aria-describedby="lower-state">
            <option value="off">オフ</option>
            <option value="pmw3610">トラックボール（PMW3610）</option>
            <option value="encoder" data-all-modules>エンコーダ</option>
            <option value="pat9125" data-extended hidden disabled>光学エンコーダ（PAT9125）</option>
            <option value="lpps" data-extended hidden disabled>LPPS（ADS1220）</option>
            <option value="stick" data-all-modules>アナログスティック</option>
            <option value="key" data-all-modules>1uキー</option>
            <option value="rzt" data-mekabu>RZT</option>
            <option value="tpd" data-mekabu>トラックパッド</option>
          </select>
          <small id="lower-state"></small>
        </div>
        <div class="slot">
          <label for="inner">中央側 <span id="inner-connector"></span></label>
          <select id="inner" aria-describedby="inner-state">
            <option value="off">オフ</option>
            <option value="pmw3610">トラックボール（PMW3610）</option>
            <option value="lpps">LPPS（ADS1220）</option>
            <option value="encoder" data-all-modules>エンコーダ</option>
            <option value="pat9125" data-extended hidden disabled>光学エンコーダ（PAT9125）</option>
            <option value="key" data-all-modules>1uキー</option>
          </select>
          <small id="inner-state"></small>
        </div>
      </div>
      <div class="actions">
        <span id="edit-state" role="status"></span>
        <button type="submit" id="save">設定を保存</button>
      </div>
    </form>
    </div>
  </main>
</body>
</html>
